<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini Clash 3D — v4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#fff;overflow:hidden}
#gc{position:relative;width:100vw;height:100vh}
canvas{display:block}

#hud{position:absolute;top:0;left:0;right:0;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(0,0,0,0.75),transparent);pointer-events:none;z-index:10}
.pinfo{display:flex;flex-direction:column;gap:4px}
.pinfo.enemy{text-align:right}
.plabel{font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.hpbar{width:200px;height:14px;background:rgba(0,0,0,0.6);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,0.18)}
.hpfill{height:100%;transition:width 0.3s}
.hpfill.blue{background:linear-gradient(90deg,#1a6fc4,#4fc3f7)}
.hpfill.red{background:linear-gradient(90deg,#b71c1c,#ef5350)}
#vs{font-size:13px;font-weight:700;opacity:0.5;letter-spacing:3px}

#minerals{position:absolute;bottom:130px;left:20px;font-size:28px;font-weight:700;color:#80deea;text-shadow:0 0 14px rgba(128,222,234,0.7);pointer-events:none;z-index:10;display:flex;align-items:center;gap:6px}

#mode-bar{position:absolute;top:90px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:10}
.mode-btn{padding:10px 16px;font-size:12px;font-weight:700;border-radius:10px;border:2px solid;cursor:pointer;transition:all 0.18s;letter-spacing:0.6px;text-transform:uppercase;min-width:170px;text-align:left;display:flex;align-items:center;gap:8px;backdrop-filter:blur(6px)}
.mode-btn:hover{transform:translateX(3px)}
.mode-btn .ico{font-size:18px}
.mode-btn .lbl{flex:1}
.mode-btn .desc{font-size:9px;opacity:0.7;display:block;letter-spacing:0;text-transform:none;margin-top:2px}
#btn-rest{background:rgba(100,140,200,0.18);border-color:#4a90e2;color:#90caf9}
#btn-rest.active{background:rgba(100,140,200,0.5);box-shadow:0 0 16px rgba(74,144,226,0.6)}
#btn-attack{background:rgba(229,57,53,0.18);border-color:#e53935;color:#ef9a9a}
#btn-attack.active{background:rgba(229,57,53,0.5);box-shadow:0 0 16px rgba(229,57,53,0.6)}
#btn-defend{background:rgba(56,142,60,0.18);border-color:#43a047;color:#a5d6a7}
#btn-defend.active{background:rgba(56,142,60,0.5);box-shadow:0 0 16px rgba(67,160,71,0.6)}

#audio-controls{position:absolute;top:90px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:10;background:rgba(0,0,0,0.4);padding:8px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(8px)}
.audio-row{display:flex;align-items:center;gap:8px}
#audio-controls button{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.55);border:1.5px solid rgba(255,255,255,0.25);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}
#audio-controls button:hover{background:rgba(0,0,0,0.78);transform:scale(1.06)}
#audio-controls button.off{opacity:0.45;border-color:rgba(255,255,255,0.15)}
#audio-controls input[type="range"]{width:90px;height:4px;accent-color:#4fc3f7;cursor:pointer}

#ubar{position:absolute;bottom:0;left:0;right:0;padding:14px 20px;background:linear-gradient(to top,rgba(0,0,0,0.88),transparent);display:flex;gap:10px;justify-content:center;z-index:10;flex-wrap:wrap}
.ucard{width:82px;padding:8px 6px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.2);border-radius:10px;cursor:pointer;transition:all 0.15s;text-align:center;backdrop-filter:blur(4px);position:relative}
.ucard:hover:not(.disabled){background:rgba(255,255,255,0.13);transform:translateY(-3px);border-color:rgba(255,255,255,0.4)}
.ucard.disabled{opacity:0.4}
.ucard.active{border-color:#80deea;background:rgba(128,222,234,0.22);box-shadow:0 0 14px rgba(128,222,234,0.5);transform:translateY(-3px)}
.ucard.active::after{content:'AUTO';position:absolute;top:-7px;right:-4px;background:#80deea;color:#0d1117;font-size:8px;font-weight:900;padding:2px 5px;border-radius:6px;letter-spacing:0.5px}
.uicon{font-size:22px;margin-bottom:2px}
.uname{font-size:11px;font-weight:700;margin-bottom:2px;color:#e0e0e0}
.ucost{font-size:10px;color:#80deea;font-weight:600}
.uslot{font-size:9px;color:#ffd54f;margin-top:1px;font-weight:600}

#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:900;pointer-events:none;opacity:0;transition:opacity 0.5s;z-index:20;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,0.9)}
#msg.show{opacity:1}
#rbtn{position:absolute;top:58%;left:50%;transform:translate(-50%,0);padding:13px 38px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#1a6fc4,#4fc3f7);color:white;border:none;border-radius:10px;cursor:pointer;display:none;z-index:20;box-shadow:0 4px 22px rgba(79,195,247,0.4)}

#instr{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.55);padding:6px 18px;border-radius:20px;font-size:12px;opacity:0.85;z-index:10;pointer-events:none;border:1px solid rgba(255,255,255,0.1)}

#enemy-state{position:absolute;top:90px;right:80px;font-size:11px;font-weight:700;color:#ef9a9a;background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:14px;border:1px solid rgba(239,154,154,0.3);z-index:10;opacity:0.8}
</style>
</head>
<body>
<div id="gc">
  <div id="hud">
    <div class="pinfo">
      <div class="plabel">Tu base</div>
      <div class="hpbar"><div class="hpfill blue" id="hp-player" style="width:100%"></div></div>
    </div>
    <div id="vs">VS</div>
    <div class="pinfo enemy">
      <div class="plabel">Base enemiga</div>
      <div class="hpbar"><div class="hpfill red" id="hp-enemy" style="width:100%"></div></div>
    </div>
  </div>

  <div id="instr">Click en una unidad para producirla automáticamente · Click de nuevo para detener</div>

  <div id="mode-bar">
    <button class="mode-btn active" id="btn-rest" onclick="setMode('rest')">
      <span class="ico">🌿</span>
      <span class="lbl">Descanso<span class="desc">deambulan cerca de la base</span></span>
    </button>
    <button class="mode-btn" id="btn-attack" onclick="setMode('attack')">
      <span class="ico">⚔️</span>
      <span class="lbl">Ataque<span class="desc">avanzan hacia el enemigo</span></span>
    </button>
    <button class="mode-btn" id="btn-defend" onclick="setMode('defend')">
      <span class="ico">🛡️</span>
      <span class="lbl">Defensa<span class="desc">regresan a la base</span></span>
    </button>
  </div>

  <div id="enemy-state">IA enemiga: <span id="ai-mode">descanso</span></div>

  <div id="audio-controls">
    <div class="audio-row">
      <button id="btn-music" onclick="toggleMusic()" title="Musica">🎵</button>
      <input type="range" id="vol-music" min="0" max="100" value="60" oninput="setMusicVol(this.value)" title="Volumen musica">
    </div>
    <div class="audio-row">
      <button id="btn-sfx" onclick="toggleSfx()" title="Efectos">🔊</button>
      <input type="range" id="vol-sfx" min="0" max="100" value="50" oninput="setSfxVol(this.value)" title="Volumen efectos">
    </div>
  </div>

  <div id="minerals">💎 <span id="mcount">0</span></div>

  <div id="ubar">
    <div class="ucard" data-unit="melee"><div class="uicon">⚔️</div><div class="uname">Guerrero</div><div class="ucost">💎 3</div></div>
    <div class="ucard" data-unit="ranged"><div class="uicon">🏹</div><div class="uname">Arquero</div><div class="ucost">💎 4</div></div>
    <div class="ucard" data-unit="tank"><div class="uicon">🛡️</div><div class="uname">Tanque</div><div class="ucost">💎 6</div></div>
    <div class="ucard" data-unit="barbarian"><div class="uicon">🪓</div><div class="uname">Bárbaro</div><div class="ucost">💎 5</div></div>
    <div class="ucard" data-unit="dino"><div class="uicon">🦖</div><div class="uname">Dinosaurio</div><div class="ucost">💎 9</div></div>
    <div class="ucard" data-unit="drone"><div class="uicon">🛸</div><div class="uname">Drone</div><div class="ucost">💎 5</div></div>
    <div class="ucard" data-unit="turret"><div class="uicon">🗼</div><div class="uname">Torreta</div><div class="ucost">💎 10</div><div class="uslot" id="turret-count">5 slots</div></div>
    <div class="ucard" data-unit="truck"><div class="uicon">🚛</div><div class="uname">Camión</div><div class="ucost">💎 8</div><div class="uslot" id="truck-count">1/2</div></div>
  </div>

  <div id="msg"></div>
  <button id="rbtn" onclick="location.reload()">Reiniciar partida</button>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ═══ ESCENA BASE ═══
const container = document.getElementById('gc');
const scene = new THREE.Scene();
// Fondo gradient cielo-horizonte usando shader
const skyGeo = new THREE.SphereGeometry(150, 32, 16);
skyGeo.scale(-1, 1, 1);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms:{
    topCol:{value:new THREE.Color(0x4a7ec0)},
    midCol:{value:new THREE.Color(0xa8c4e0)},
    botCol:{value:new THREE.Color(0xd8dfe5)}
  },
  vertexShader:'varying vec3 vWp;void main(){vWp=normalize((modelMatrix*vec4(position,1.0)).xyz);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform vec3 topCol;uniform vec3 midCol;uniform vec3 botCol;varying vec3 vWp;void main(){float h=vWp.y;vec3 c=h>0.0?mix(midCol,topCol,smoothstep(0.0,0.7,h)):mix(midCol,botCol,smoothstep(0.0,-0.3,h));gl_FragColor=vec4(c,1.0);}'
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

scene.fog = new THREE.Fog(0xb0c5d8, 40, 90);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 20, 26);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Manejo de context lost de WebGL (importante con muchos meshes)
renderer.domElement.addEventListener('webglcontextlost', function(e){
  e.preventDefault();
  console.warn('WebGL context lost - intentando recuperar');
  STATE.gameOver = true;
  const m = document.getElementById('msg');
  m.textContent = 'Error gráfico\nRecarga la página';
  m.style.color = '#ffd54f';
  m.style.fontSize = '36px';
  m.classList.add('show');
  document.getElementById('rbtn').style.display = 'block';
}, false);


// ═══ LUCES ═══
scene.add(new THREE.AmbientLight(0xb8cce0, 0.65));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.25);
sun.position.set(12, 28, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-30; sun.shadow.camera.right=30;
sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30;
sun.shadow.bias=-0.001;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x6694cc, 0.35);
fill.position.set(-8, 6, -5);
scene.add(fill);

// ═══ MATERIALES ═══
const gradTex = (()=>{
  const d=new Uint8Array([60,140,230]);
  const t=new THREE.DataTexture(d,3,1,THREE.RedFormat);
  t.needsUpdate=true; return t;
})();
function toon(hex){return new THREE.MeshToonMaterial({color:hex,gradientMap:gradTex})}
function basic(hex,op=1){return new THREE.MeshBasicMaterial({color:hex,transparent:op<1,opacity:op})}

// ═══ MONTAÑAS DE FONDO (parallax) ═══
function makeMountainRange(z, color, count, scale){
  const g = new THREE.Group();
  for(let i=0;i<count;i++){
    const w = 8+Math.random()*12;
    const h = 6+Math.random()*8;
    const mat = new THREE.MeshBasicMaterial({color:color,fog:false});
    const m = new THREE.Mesh(new THREE.ConeGeometry(w*scale, h*scale, 4), mat);
    m.position.set((i-count/2)*w*scale*0.9 + (Math.random()-0.5)*4, h*scale/2-1, z);
    m.rotation.y = Math.random()*Math.PI;
    g.add(m);
  }
  return g;
}
// Capas de montañas para profundidad
scene.add(makeMountainRange(-45, 0x6a8aa8, 12, 1.4));
scene.add(makeMountainRange(-55, 0x8aa4c0, 10, 1.6));
scene.add(makeMountainRange(-70, 0xa4bcd4, 8, 1.8));

// Nubes flotantes
const clouds = [];
for(let i=0;i<8;i++){
  const cg = new THREE.Group();
  for(let j=0;j<4;j++){
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(2+Math.random()*1.5, 8, 6),
      new THREE.MeshBasicMaterial({color:0xfafcff,fog:false,transparent:true,opacity:0.85})
    );
    sphere.position.set(j*1.8-2.5, Math.random()*0.5, Math.random()*0.8);
    sphere.scale.y = 0.6;
    cg.add(sphere);
  }
  cg.position.set((Math.random()-0.5)*120, 22+Math.random()*8, -30-Math.random()*30);
  cg.userData.speed = 0.05+Math.random()*0.08;
  clouds.push(cg);
  scene.add(cg);
}

// ═══ TERRENO ═══
const LANE_LEN = 28, LANE_W = 5;

const grass = new THREE.Mesh(new THREE.BoxGeometry(44, 0.6, 18), toon(0x4a8a3a));
grass.position.y = -0.3;
grass.receiveShadow = true;
scene.add(grass);

// Terreno extendido visible al fondo
const farGround = new THREE.Mesh(new THREE.BoxGeometry(200, 0.4, 80), toon(0x55995a));
farGround.position.set(0, -0.45, -25);
scene.add(farGround);

// Parches de hierba con flores
for(let i=0;i<35;i++){
  const w=0.4+Math.random()*0.7, d=0.3+Math.random()*0.6;
  const colors = [0x5fa04a, 0x3d7530, 0x6ab050];
  const patch = new THREE.Mesh(new THREE.BoxGeometry(w,0.12,d), toon(colors[Math.floor(Math.random()*3)]));
  patch.position.set((Math.random()-0.5)*42, 0.02, (Math.random()-0.5)*16);
  patch.receiveShadow=true; scene.add(patch);
}
// Flores pequeñas
for(let i=0;i<20;i++){
  const colors = [0xffeb3b, 0xe91e63, 0xffffff, 0xff9800];
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.12, 5, 4), toon(colors[Math.floor(Math.random()*4)]));
  f.position.set((Math.random()-0.5)*40, 0.15, (Math.random()-0.5)*16);
  scene.add(f);
}

// Carril principal
const road = new THREE.Mesh(new THREE.BoxGeometry(LANE_LEN,0.08,LANE_W), toon(0xc4a070));
road.position.y = 0.04;
road.receiveShadow = true;
scene.add(road);

// Bordes
[-1,1].forEach(side=>{
  for(let xi=-13;xi<=13;xi+=1.2){
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.0,0.18,0.9), toon(xi%2===0?0xd6b888:0xb5935a));
    b.position.set(xi, 0.1, side*(LANE_W/2+0.5));
    b.receiveShadow=true; scene.add(b);
  }
});

// Árboles
function makeTree(x,z){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,1.4,6),toon(0x5c3a1a));
  trunk.position.y=0.7; trunk.castShadow=true; g.add(trunk);
  const c1=new THREE.Mesh(new THREE.ConeGeometry(1.3,2.2,7),toon(0x2e7a2e));
  c1.position.y=2.8; c1.castShadow=true; g.add(c1);
  const c2=new THREE.Mesh(new THREE.ConeGeometry(1.0,1.8,7),toon(0x3a8a3a));
  c2.position.y=4.0; g.add(c2);
  g.position.set(x,0,z); scene.add(g);
}
[[-18,6],[-16,-7],[-14,8],[14,6],[16,-7],[18,8],[-20,-4],[20,-5],[-18,2],[18,3]].forEach(([x,z])=>makeTree(x,z));
// Árboles lejanos al fondo
for(let i=0;i<20;i++){
  const x = (Math.random()-0.5)*100;
  const z = -15-Math.random()*30;
  makeTree(x,z);
}

// Rocas
function makeRock(x,z,s=1){
  const g=new THREE.Group();
  [[0,0,0.5],[0.4,0,0.35],[-0.3,0,0.4]].forEach(([rx,ry,rs])=>{
    const r=new THREE.Mesh(new THREE.DodecahedronGeometry(rs*s,0),toon(0x7a7a7a));
    r.position.set(rx*s,rs*s*0.5,ry*s); r.castShadow=true; g.add(r);
  });
  g.position.set(x,0,z); scene.add(g);
}
[[-12,7],[-10,-6],[11,7],[12,-6],[-15,-4],[15,4]].forEach(([x,z])=>makeRock(x,z,0.6+Math.random()*0.4));

// ═══ TORRES ═══
function createTower(x, mainColor){
  const g = new THREE.Group();
  const wall = new THREE.Mesh(new THREE.BoxGeometry(4.5,1.2,4.5), toon(0x7a7a7a));
  wall.position.y=0.6; wall.castShadow=true; wall.receiveShadow=true; g.add(wall);
  [[-1.6,-1.6],[-1.6,1.6],[1.6,-1.6],[1.6,1.6]].forEach(([cx,cz])=>{
    const ct=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.5,2.4,8),toon(0x8a8a8a));
    ct.position.set(cx,1.5,cz); ct.castShadow=true; g.add(ct);
    const cr=new THREE.Mesh(new THREE.ConeGeometry(0.6,0.8,8),toon(0x5d3a1a));
    cr.position.set(cx,2.9,cz); g.add(cr);
  });
  const body=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.35,4.2,10),toon(mainColor));
  body.position.y=3.3; body.castShadow=true; g.add(body);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.35,0.55,0.35),toon(0x8a8a8a));
    m.position.set(Math.cos(a)*1.15,5.6,Math.sin(a)*1.15); g.add(m);
  }
  const roof=new THREE.Mesh(new THREE.ConeGeometry(1.35,2.0,10),toon(0x4d2a08));
  roof.position.y=6.5; roof.castShadow=true; g.add(roof);
  const win=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.6,0.15),basic(0xffcc44,0.95));
  win.position.set(x<0?1.12:-1.12,4.2,0); g.add(win);
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,2.2,6),toon(0x555555));
  pole.position.y=8.1; g.add(pole);
  const flag=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.6,0.08),toon(mainColor));
  flag.position.set(0.5,9.0,0); g.userData.isFlag=true; g.add(flag);
  g.position.x=x;
  return g;
}
const playerTower=createTower(-LANE_LEN/2,0x1a6fc4);
const enemyTower=createTower(LANE_LEN/2,0xb71c1c);
scene.add(playerTower); scene.add(enemyTower);

// ═══ NIEBLA DE GUERRA: partículas de humo en vez de plano ═══
// Sistema de "puffs" que cubren la mitad enemiga y se disipan donde hay unidades del jugador
const fogPuffs = [];
const fogGroup = new THREE.Group();
scene.add(fogGroup);

function createFogPuff(x, z){
  const size = 1.8 + Math.random()*1.5;
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(size, 8, 6),
    new THREE.MeshBasicMaterial({color:0xb8c4d0, transparent:true, opacity:0.55, fog:false, depthWrite:false})
  );
  m.position.set(x, 1.5+Math.random()*0.8, z);
  m.scale.y = 0.6;
  m.userData.baseOpacity = 0.5+Math.random()*0.15;
  m.userData.phase = Math.random()*Math.PI*2;
  m.userData.driftSpeed = 0.15+Math.random()*0.2;
  fogGroup.add(m);
  return m;
}

// Crear puffs cubriendo lado enemigo
for(let x=2; x<LANE_LEN/2+5; x+=1.5){
  for(let z=-9; z<=9; z+=2){
    fogPuffs.push(createFogPuff(x + (Math.random()-0.5)*1.5, z + (Math.random()-0.5)*1.5));
  }
}

function updateFog(dt, elapsed){
  for(const p of fogPuffs){
    // Movimiento sutil
    p.userData.phase += dt * p.userData.driftSpeed;
    p.position.y = 1.8 + Math.sin(p.userData.phase)*0.3;
    p.rotation.y += dt * 0.1;

    // Opacidad base con respiración
    let opacity = p.userData.baseOpacity * (0.85 + 0.15*Math.sin(p.userData.phase));

    // Disipación según unidades del jugador cercanas (incluye drones)
    let revealAmount = 0;
    for(const u of STATE.units){
      if(u.side !== -1) continue;
      if(u.mesh.position.x < 0) continue;
      const dx = u.mesh.position.x - p.position.x;
      const dz = u.mesh.position.z - p.position.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if(d < 14) revealAmount = Math.max(revealAmount, 1-d/14);
    }

    p.material.opacity = opacity * (1 - revealAmount);
  }
}

// ═══ MEMORY MANAGEMENT ═══
function disposeMesh(mesh){
  if(!mesh) return;
  mesh.traverse(obj => {
    if(obj.geometry) obj.geometry.dispose();
    if(obj.material){
      if(Array.isArray(obj.material)) obj.material.forEach(m=>m.dispose());
      else obj.material.dispose();
    }
  });
}
function removeAndDispose(mesh){
  if(!mesh) return;
  if(mesh.parent) mesh.parent.remove(mesh);
  disposeMesh(mesh);
}

}

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    musicGain = audioCtx.createGain();
    musicGain.gain.value = STATE.musicOn ? (0.15 * STATE.musicVolume) : 0;
    musicGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = STATE.sfxOn ? STATE.sfxVolume : 0;
    sfxGain.connect(audioCtx.destination);

    // Drone ambiental sutil
    const o1 = audioCtx.createOscillator(); o1.type='sine'; o1.frequency.value=130.81; // C3
    const o2 = audioCtx.createOscillator(); o2.type='sine'; o2.frequency.value=196.00; // G3
    const droneFilter = audioCtx.createBiquadFilter();
    droneFilter.type='lowpass'; droneFilter.frequency.value=500;
    const droneGain = audioCtx.createGain(); droneGain.gain.value=0.35;
    o1.connect(droneFilter); o2.connect(droneFilter);
    droneFilter.connect(droneGain); droneGain.connect(musicGain);
    o1.start(); o2.start();

    // Melodia pentatonica chill (escala C mayor pentatonica)
    // Notas: C4=261, D4=293, E4=329, G4=392, A4=440, C5=523
    const pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
    const rhythms = [0.5, 0.75, 0.5, 1.0, 0.75, 0.5]; // beats por nota
    let beatIdx = 0;
    let nextNoteTime = audioCtx.currentTime + 0.5;

    function scheduleNote(){
      if(!audioCtx) return;
      const now = audioCtx.currentTime;
      // Programar las proximas notas si toca
      while(nextNoteTime < now + 0.5){
        const noteFreq = pentatonic[Math.floor(Math.random()*pentatonic.length)];
        const noteDur = rhythms[beatIdx % rhythms.length];
        playMusicNote(noteFreq, noteDur*0.95, nextNoteTime);
        // Ocasionalmente acorde armonico
        if(Math.random() < 0.3){
          playMusicNote(noteFreq*1.5, noteDur*0.7, nextNoteTime+0.05, 0.4); // quinta
        }
        nextNoteTime += noteDur * 0.6; // tempo
        beatIdx++;
      }
    }
    musicScheduler = setInterval(scheduleNote, 200);

  }catch(e){console.log('Audio no disponible:',e);}
}

function playMusicNote(freq, duration, when, volMul=1){
  if(!audioCtx || !musicGain) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, when);
  // ADSR suave para sonido chill
  const peak = 0.08 * volMul;
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(peak, when + 0.05);
  g.gain.linearRampToValueAtTime(peak*0.6, when + duration*0.3);
  g.gain.exponentialRampToValueAtTime(0.0001, when + duration);
  // Filtro lowpass para suavizar
  const filt = audioCtx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value=2200;
  o.connect(filt); filt.connect(g); g.connect(musicGain);
  o.start(when); o.stop(when + duration + 0.05);
}

function playSound(freq, type='sine', dur=0.15, vol=0.1){
  if(!audioCtx || !STATE.sfxOn || !sfxGain) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
  o.connect(g); g.connect(sfxGain);
  o.start(); o.stop(audioCtx.currentTime+dur);
}

// ═══ TORRETAS ═══
function getTurretSlots(side){
  const slots=[];
  const startX=side===-1?-LANE_LEN/2+4:LANE_LEN/2-4;
  const step=side===-1?2.4:-2.4;
  for(let c=0;c<5;c++){
    const x=startX+step*c;
    if(side===-1&&x>-1) continue;
    if(side===+1&&x<1) continue;
    slots.push({x,z:-3.8}); slots.push({x,z:3.8});
  }
  return slots;
}
function findFreeTurretSlot(side){
  for(const sl of getTurretSlots(side)){
    if(!STATE.turrets.some(t=>t.side===side&&Math.abs(t.mesh.position.x-sl.x)<0.5&&Math.abs(t.mesh.position.z-sl.z)<0.5))
      return sl;
  } return null;
}
function countTurrets(side){return STATE.turrets.filter(t=>t.side===side).length}
function countTrucks(side){return STATE.trucks.filter(t=>t.userData.side===side).length}
function countUnits(side){return STATE.units.filter(u=>u.side===side).length}

    walkCycle:Math.random()*Math.PI*2,

    wanderTarget:null, wanderTimer:0,

}

function spawnTurret(side,xPos){

// ═══ TARGETING ═══
function findTarget(unit){
  const PROX=unit.range+1.5;
  let bu=null, bd=Infinity;
  for(const o of STATE.units){
    if(o.side===unit.side) continue;
    if(o.flying&&!unit.canHitAir) continue;
    const d=unit.mesh.position.distanceTo(o.mesh.position);
    if(d<bd){bd=d;bu=o;}
  }
  if(bu&&bd<=PROX) return{kind:'unit',ref:bu,dist:bd};
  let bt=null, btd=Infinity;
  for(const t of STATE.turrets){
    if(t.side===unit.side) continue;
    const d=unit.mesh.position.distanceTo(t.mesh.position);
    if(d<btd){btd=d;bt=t;}
  }
  if(bt) return{kind:'turret',ref:bt,dist:btd};
  const et=unit.side===-1?enemyTower:playerTower;
  const ep=et.position.clone(); ep.y=unit.mesh.position.y;
  return{kind:'tower',ref:et,dist:unit.mesh.position.distanceTo(ep),pos:ep};
}

// ═══ ANIMACIÓN ═══
function animateWalk(unit,dt){
  unit.walkCycle += dt*8;
  if(!unit.flying) unit.mesh.position.y=Math.abs(Math.sin(unit.walkCycle))*0.07;

  if(unit.isDino){
    // Cuadrúpedo orientado hacia +Z: patas rotan en eje X (adelante-atras)
    // Patrón diagonal: FR+BL en fase, FL+BR en contrafase
    const phase1 = Math.sin(unit.walkCycle);
    const phase2 = Math.sin(unit.walkCycle + Math.PI);
    if(unit.mesh.userData.legFR) unit.mesh.userData.legFR.rotation.x = phase1 * 0.4;
    if(unit.mesh.userData.legBL) unit.mesh.userData.legBL.rotation.x = phase1 * 0.4;
    if(unit.mesh.userData.legFL) unit.mesh.userData.legFL.rotation.x = phase2 * 0.4;
    if(unit.mesh.userData.legBR) unit.mesh.userData.legBR.rotation.x = phase2 * 0.4;
    // Bobbing del cuerpo
    unit.mesh.position.y = Math.abs(Math.sin(unit.walkCycle*2))*0.1;
    // Cola se balancea lateralmente (eje Y porque la cola apunta en -Z)
    if(unit.mesh.userData.tail) unit.mesh.userData.tail.rotation.y = Math.sin(unit.walkCycle*0.7)*0.3;
    // Cabeza sube y baja sutilmente (rotation.x del pivot)
    if(unit.mesh.userData.head) unit.mesh.userData.head.rotation.x = Math.sin(unit.walkCycle)*0.08;
  } else {
    if(unit.mesh.userData.legL) unit.mesh.userData.legL.rotation.x=Math.sin(unit.walkCycle)*0.4;
    if(unit.mesh.userData.legR) unit.mesh.userData.legR.rotation.x=Math.sin(unit.walkCycle+Math.PI)*0.4;
  }
}

function lookAtTarget(unit, targetPos){
  const dir = new THREE.Vector3().subVectors(targetPos, unit.mesh.position);
  if(dir.length() > 0.01){
    unit.mesh.lookAt(unit.mesh.position.x+dir.x, unit.mesh.position.y, unit.mesh.position.z+dir.z);
  }
}

function moveTowards(unit, targetPos, dt, speedMul=1){
  const dir=new THREE.Vector3().subVectors(targetPos,unit.mesh.position);
  dir.y=0;
  const dist=dir.length();
  if(dist>0.3){
    dir.normalize();
    unit.mesh.position.addScaledVector(dir,unit.speed*speedMul*dt);
    unit.mesh.lookAt(unit.mesh.position.x+dir.x, unit.mesh.position.y, unit.mesh.position.z+dir.z);
    if(unit.flying){
      unit.mesh.position.y=unit.hoverY+Math.sin(unit.bobPhase*0.5)*0.15;
      if(unit.mesh.userData.rotorGroup) unit.mesh.userData.rotorGroup.rotation.y+=dt*30;
    } else {
      animateWalk(unit,dt);
    }
  }
  return dist;
}

function updateUnit(unit,dt){
  unit.attackCD-=dt;
  unit.bobPhase+=dt*8;

  const mode = unit.side===-1 ? STATE.player.mode : STATE.enemy.mode;
  const myState = unit.side===-1 ? STATE.player : STATE.enemy;

  // ─ DRONE AGGRO: arqueros buscan drones cuando están en aggro ─
  if(unit.type==='ranged' && myState.droneAggroTimer > 0){
    // Buscar drone enemigo más cercano
    let droneTarget = null;
    let bdist = Infinity;
    for(const o of STATE.units){
      if(o.side === unit.side) continue;
      if(o.type !== 'drone') continue;
      const d = unit.mesh.position.distanceTo(o.mesh.position);
      if(d < bdist){ bdist = d; droneTarget = o; }
    }
    if(droneTarget){
      const dpos = droneTarget.mesh.position;
      const dist = unit.mesh.position.distanceTo(dpos);
      if(dist > unit.range){
        moveTowards(unit, dpos, dt, 1.1); // un poco mas rapido al perseguir
        updateHPBar(unit);
        return;
      } else {
        // En rango: disparar
        lookAtTarget(unit, dpos);
        if(unit.attackCD <= 0){
          unit.attackCD = unit.attackInterval;
          shootOrMelee(unit, {kind:'unit', ref:droneTarget}, dpos);
        }
        updateHPBar(unit);
        return;
      }
    }
  }

  // Aggro individual: perseguir al que me ataco
  if(unit.aggroTarget && unit.aggroTimer > 0){
    unit.aggroTimer -= dt;
    // Verificacion robusta: target vivo, en STATE, y con mesh valido
    if(unit.aggroTarget.hp > 0 && unit.aggroTarget.mesh && STATE.units.includes(unit.aggroTarget)){
      const apos = unit.aggroTarget.mesh.position;
      const adist = unit.mesh.position.distanceTo(apos);
      if(adist > unit.range){
        // Solo perseguir si flying y puedo pegarle, o si no flying
        if(!unit.aggroTarget.flying || unit.canHitAir){
          moveTowards(unit, apos, dt, 1.05);
          updateHPBar(unit);
          return;
        }
      } else {
        lookAtTarget(unit, apos);
        if(unit.attackCD <= 0){
          unit.attackCD = unit.attackInterval;
          if(!unit.aggroTarget.flying || unit.canHitAir){
            shootOrMelee(unit, {kind:'unit', ref:unit.aggroTarget}, apos);
          }
        }
        updateHPBar(unit);
        return;
      }
    } else {
      // Atacante murio, limpiar aggro
      unit.aggroTarget = null;
      unit.aggroTimer = 0;
    }
  }

  const target=findTarget(unit);
  const targetPos = target.kind==='tower'?target.pos:target.ref.mesh.position;
  const distToTarget = unit.mesh.position.distanceTo(targetPos);

  // ─ ENEMIGO CERCANO: atacar prioritariamente ─
  if(target.kind==='unit' || target.kind==='turret'){
    if(distToTarget <= unit.range+0.3){
      if(!unit.flying) unit.mesh.position.y=0;
      else{
        unit.mesh.position.y=unit.hoverY+Math.sin(unit.bobPhase*0.5)*0.15;
        if(unit.mesh.userData.rotorGroup) unit.mesh.userData.rotorGroup.rotation.y+=dt*30;
      }
      // Girar el cuerpo entero hacia el enemigo
      lookAtTarget(unit, targetPos);
      if(unit.attackCD<=0){
        unit.attackCD=unit.attackInterval;
        shootOrMelee(unit,target,targetPos);
      }
      const pulse=1+Math.max(0,Math.sin(unit.bobPhase*2))*0.06;
      unit.mesh.scale.set(pulse,pulse,pulse);
      updateHPBar(unit);
      return;
    } else if(distToTarget <= unit.range+4){
      moveTowards(unit, targetPos, dt);
      updateHPBar(unit);
      return;
    }
  }

  // ─ MODO ATAQUE ─
  if(mode==='attack'){
    if(target.kind==='tower' && distToTarget <= unit.range){
      lookAtTarget(unit, targetPos);
      if(unit.attackCD<=0){
        unit.attackCD=unit.attackInterval;
        shootOrMelee(unit,target,targetPos);
      }
    } else {
      moveTowards(unit, targetPos, dt);
    }
    updateHPBar(unit);
    return;
  }

  // ─ MODO DEFENSA ─
  if(mode==='defend'){
    const myTower = unit.side===-1?playerTower:enemyTower;
    const defendPos = myTower.position.clone();
    defendPos.x += unit.side===-1 ? 4 : -4;
    defendPos.z = (unit.mesh.position.z * 0.7);
    const dToDefend = unit.mesh.position.distanceTo(defendPos);
    if(dToDefend > 1.5){
      moveTowards(unit, defendPos, dt);
    } else {
      if(!unit.wanderTimer || unit.wanderTimer<=0){
        unit.wanderTimer = 2+Math.random()*2;
        const baseX = unit.side===-1?-LANE_LEN/2+4:LANE_LEN/2-4;
        unit.wanderTarget = new THREE.Vector3(baseX+(Math.random()-0.5)*2, 0, (Math.random()-0.5)*5);
      }
      unit.wanderTimer -= dt;
      if(unit.wanderTarget) moveTowards(unit, unit.wanderTarget, dt, 0.5);
    }
    updateHPBar(unit);
    return;
  }

  // ─ MODO DESCANSO ─
  unit.wanderTimer -= dt;
  // Chance de "decidir" cruzar al lado enemigo para hostigar (controla acumulacion)
  // Probabilidad fija pequena por segundo
  if(!unit.suicidalEscape){
    if(Math.random() < 0.015*dt){
      unit.suicidalEscape = true;
      unit.wanderTarget = null;
    }
  }
  // Si esta en modo suicida, va hacia base enemiga directamente
  if(unit.suicidalEscape && target.kind==='tower'){
    moveTowards(unit, target.pos, dt);
    updateHPBar(unit);
    return;
  }

  if(!unit.wanderTarget || unit.wanderTimer<=0){
    unit.wanderTimer = 3+Math.random()*4;
    // Area de descanso MUY AMPLIA: usa toda la zona visible
    // Player (-1): X de -22 a -3, Z de -12 a +12
    // Enemy (+1): X de 3 a 22, Z de -12 a +12
    const minX = unit.side===-1 ? -22 : 3;
    const maxX = unit.side===-1 ? -3 : 22;
    const wx = minX + Math.random()*(maxX-minX);
    const wz = (Math.random()-0.5) * 24;
    unit.wanderTarget = new THREE.Vector3(wx, 0, wz);
  }
  moveTowards(unit, unit.wanderTarget, dt, 0.55);
  updateHPBar(unit);
}

function updateHPBar(unit){
  const r=Math.max(0,unit.hp/unit.maxHp);
  if(unit.mesh.userData.hpFill){
    unit.mesh.userData.hpFill.scale.x=r;
    unit.mesh.userData.hpFill.position.x=-(1-r)*0.43;
  }
}

function shootOrMelee(unit,target,targetPos){
  if(unit.type==='ranged'||unit.type==='drone'){
    const from=unit.mesh.position.clone(); from.y=1.5;
    const to=targetPos.clone(); to.y=1.5;
    const pColor=unit.type==='drone'?0x00e5ff:0xffeb3b;
    const pm=new THREE.Mesh(new THREE.SphereGeometry(0.14,8,8),toon(pColor));
    pm.position.copy(from); scene.add(pm);
    STATE.projectiles.push({mesh:pm,dmg:unit.dmg,speed:15,targetPos:to,targetKind:target.kind,targetRef:target.ref,attackerUnit:unit});
    playSound(unit.type==='drone'?880:680,'triangle',0.06,0.025);
  } else {
    applyDmg(target,unit.dmg,unit);
    spawnImpactParticles(targetPos);
    playSound(380,'sine',0.08,0.025);
  }
}

function spawnImpactParticles(pos){
  if(countParticles() > MAX_PARTICLES) return; // freno duro
  const cnt = countParticles() > MAX_PARTICLES*0.7 ? 2 : 5;
  for(let i=0;i<cnt;i++){
    const pm=new THREE.Mesh(new THREE.SphereGeometry(0.07,6,6),basic(0xffcc44,0.9));
    pm.position.copy(pos);
    scene.add(pm);
    STATE.projectiles.push({mesh:pm,isParticle:true,vel:new THREE.Vector3((Math.random()-0.5)*4,(Math.random()+0.5)*3,(Math.random()-0.5)*4),life:0.4+Math.random()*0.3});
  }
}

function applyDmg(target,dmg,attacker){
  if(target.kind==='unit') target.ref.hp-=dmg;
  else if(target.kind==='turret') target.ref.hp-=dmg;
  else{
    if(target.ref===playerTower) STATE.player.towerHP-=dmg;
    else STATE.enemy.towerHP-=dmg;
    updateHUD();
  }
  // Si el atacante es un drone, activar aggro general en arqueros del lado contrario
  if(attacker && attacker.type==='drone'){
    triggerDroneAggro(-attacker.side);
  }
  // Aggro individual: si una unidad melee/barbaro/tank recibe dano,
  // marca al atacante como su aggroTarget para ir a buscarlo
  if(target.kind==='unit' && attacker && attacker.mesh){
    const tref = target.ref;
    if(['melee','barbarian','tank','dino'].includes(tref.type)){
      tref.aggroTarget = attacker;
      tref.aggroTimer = 7;
    }
  }
}

function triggerDroneAggro(side){
  // Side al que se debe activar aggro (el lado de las VICTIMAS, contrario al drone)
  if(side===-1) STATE.player.droneAggroTimer = 6; // 6 segundos de aggro
  else STATE.enemy.droneAggroTimer = 6;
}

function updateProjectiles(dt){
  for(let i=STATE.projectiles.length-1;i>=0;i--){
    const p=STATE.projectiles[i];
    if(p.isParticle){
      p.life-=dt;
      p.mesh.position.addScaledVector(p.vel,dt);
      p.vel.y-=9.8*dt;
      p.mesh.material.opacity=Math.max(0,p.life/0.5);
      if(p.life<=0){removeAndDispose(p.mesh);STATE.projectiles.splice(i,1);}
      continue;
    }
    if(p.targetKind==='unit' && p.targetRef && p.targetRef.hp>0 && p.targetRef.mesh){
      p.targetPos=p.targetRef.mesh.position.clone(); p.targetPos.y=1.5;
    } else if(p.targetKind==='turret' && p.targetRef && p.targetRef.hp>0 && p.targetRef.mesh){
      p.targetPos=p.targetRef.mesh.position.clone(); p.targetPos.y=2.0;
    }
    const dir=new THREE.Vector3().subVectors(p.targetPos,p.mesh.position);
    const dist=dir.length();
    if(dist<0.3){
      const attacker = p.attackerUnit || null;
      // Splash damage si es explosivo
      if(p.isExplosive && p.splashRadius){
        const impactPos = p.mesh.position.clone();
        // Daño en area a todas las unidades enemigas cercanas al impacto
        const victimSide = p.targetRef ? p.targetRef.side : null;
        for(const u of STATE.units){
          if(victimSide!==null && u.side!==victimSide) continue;
          const d = u.mesh.position.distanceTo(impactPos);
          if(d <= p.splashRadius){
            const falloff = 1 - (d/p.splashRadius)*0.5;
            applyDmg({kind:'unit', ref:u}, p.dmg*falloff, attacker);
          }
        }
        // Explosion visual: cantidad adaptativa
        const explCount = countParticles() > MAX_PARTICLES*0.7 ? 4 : 12;
        for(let k=0;k<explCount;k++){
          if(countParticles() >= MAX_PARTICLES) break;
          const pm2=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,6),basic(0xff5722,0.95));
          pm2.position.copy(impactPos);
          scene.add(pm2);
          STATE.projectiles.push({mesh:pm2,isParticle:true,vel:new THREE.Vector3((Math.random()-0.5)*8,(Math.random()+0.5)*5,(Math.random()-0.5)*8),life:0.5+Math.random()*0.3});
        }
        playSound(140,'sine',0.18,0.05);
      } else {
        applyDmg({kind:p.targetKind,ref:p.targetRef},p.dmg, attacker);
        spawnImpactParticles(p.mesh.position.clone());
      }
      removeAndDispose(p.mesh); STATE.projectiles.splice(i,1);
    } else {
      dir.normalize(); p.mesh.position.addScaledVector(dir,p.speed*dt);
    }
  }
}

function updateTurret(t,dt){
  t.attackCD-=dt;
  let best=null,bd=Infinity;
  for(const u of STATE.units){
    if(u.side===t.side) continue;
    const d=t.mesh.position.distanceTo(u.mesh.position);
    if(d<bd&&d<=t.range){bd=d;best=u;}
  }
  if(best){
    const dir=new THREE.Vector3().subVectors(best.mesh.position,t.mesh.position);
    t.mesh.userData.head.rotation.y=-Math.atan2(dir.z,dir.x);
    if(t.attackCD<=0){
      t.attackCD=t.attackInterval;
      const from=t.mesh.position.clone(); from.y=2.5;
      const to=best.mesh.position.clone(); to.y=1.5;
      const pm=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,8),toon(0xff5722));
      pm.position.copy(from); scene.add(pm);
      STATE.projectiles.push({mesh:pm,dmg:t.dmg,speed:18,targetPos:to,targetKind:'unit',targetRef:best});
      playSound(520,'triangle',0.08,0.03);
    }
  }
  const r=Math.max(0,t.hp/t.maxHp);
  t.mesh.userData.hpFill.scale.x=r;
  t.mesh.userData.hpFill.position.x=-(1-r)*0.67;
}

function updateBaseTower(side,dt){
  const pl=side===-1?STATE.player:STATE.enemy;
  const tw=side===-1?playerTower:enemyTower;
  pl.towerAttackCD-=dt;

  // Buscar todas las unidades enemigas en rango y ordenar por distancia
  const inRange = [];
  for(const u of STATE.units){
    if(u.side===side) continue;
    const d=u.mesh.position.distanceTo(tw.position);
    if(d<=BASE_DEF.range) inRange.push({u, d});
  }
  inRange.sort((a,b)=>a.d-b.d);

  if(inRange.length>0 && pl.towerAttackCD<=0){
    pl.towerAttackCD = BASE_DEF.attackInterval;
    // Disparar a hasta maxTargets, cada uno con splash
    const targets = inRange.slice(0, BASE_DEF.maxTargets);
    targets.forEach((entry, idx)=>{
      const from = tw.position.clone(); from.y = 5;
      // Pequeno offset para visualizar multiples disparos
      const target = entry.u;
      const to = target.mesh.position.clone();
      const pm = new THREE.Mesh(new THREE.SphereGeometry(0.32,8,8),toon(0xff1744));
      pm.position.copy(from);
      scene.add(pm);
      STATE.projectiles.push({
        mesh:pm, dmg:BASE_DEF.dmg, speed:20,
        targetPos:to, targetKind:'unit', targetRef:target,
        splashRadius: BASE_DEF.splashRadius, isExplosive:true,
      });
    });
    playSound(165,'sine',0.3,0.06);
    playSound(220,'triangle',0.25,0.04);
  }
}

function cleanDeadUnits(){
  for(let i=STATE.units.length-1;i>=0;i--){
    const u=STATE.units[i];
    if(u.hp<=0){
      // Solo spawn particulas si no hay muchas ya
      if(countParticles() < MAX_PARTICLES - 5){
        spawnImpactParticles(u.mesh.position.clone());
      }
      removeAndDispose(u.mesh);
      // Limpiar referencias en otras unidades que tenian aggro a esta
      for(const other of STATE.units){
        if(other.aggroTarget === u){
          other.aggroTarget = null;
          other.aggroTimer = 0;
        }
      }
      STATE.units.splice(i,1);
      playSound(280,'sine',0.15,0.035);
    }
  }
}
function cleanDeadTurrets(){
  for(let i=STATE.turrets.length-1;i>=0;i--){
    if(STATE.turrets[i].hp<=0){
      removeAndDispose(STATE.turrets[i].mesh);
      STATE.turrets.splice(i,1);
    }
  }
}

// ═══ CAMIONES ═══
function closestMineral(truck){
  const mins=truck.userData.side===-1?pMins:eMins;
  let c=null,d=Infinity;
  for(const m of mins){const dd=truck.position.distanceTo(m.position);if(dd<d){d=dd;c=m;}}
  return c;
}
function updateTruck(truck,dt){
  const ud=truck.userData;
  const mins=ud.side===-1?pMins:eMins;
  const tw=ud.side===-1?playerTower:enemyTower;
  if(ud.state==='toMineral'){
    if(!ud.target||!mins.includes(ud.target)) ud.target=closestMineral(truck);
    if(ud.target){
      const dir=new THREE.Vector3().subVectors(ud.target.position,truck.position);
      dir.y=0;
      if(dir.length()<0.6){
        scene.remove(ud.target);
        const idx=mins.indexOf(ud.target); if(idx>=0) mins.splice(idx,1);
        ud.target=null; ud.state='returning'; ud.cargo.visible=true;
        setTimeout(()=>{
          if(STATE.gameOver) return;
          const bx=ud.side*(LANE_LEN/2+2);
          const m=mkMineral(bx+(Math.random()-0.5)*3,4.5+Math.random()*2.5);
          if(ud.side===-1)pMins.push(m); else eMins.push(m);
        },3000);
      } else {
        dir.normalize(); truck.position.addScaledVector(dir,ud.speed*dt);
        truck.lookAt(truck.position.x+dir.x,truck.position.y,truck.position.z+dir.z);
      }
    }
  } else {
    const dir=new THREE.Vector3().subVectors(tw.position,truck.position); dir.y=0;
    if(dir.length()<1.6){
      if(ud.side===-1) STATE.player.mineral=Math.min(40,STATE.player.mineral+2);
      else STATE.enemy.mineral=Math.min(40,STATE.enemy.mineral+2);
      ud.cargo.visible=false; ud.state='toMineral'; updateHUD();
    } else {
      dir.normalize(); truck.position.addScaledVector(dir,ud.speed*dt);
      truck.lookAt(truck.position.x+dir.x,truck.position.y,truck.position.z+dir.z);
    }
  }
}

// ═══ IA ENEMIGA — ACUMULAR, ATACAR, DEFENDER ═══
function updateEnemyAI(dt){
  STATE.enemyDecideTimer -= dt;
  STATE.enemySpawnTimer -= dt;
  STATE.enemyTurretTimer -= dt;
  STATE.enemyTruckTimer -= dt;

  // ── Decisión estratégica (cada 12-20s) ──
  if(STATE.enemyDecideTimer <= 0){
    const enemyUnits = countUnits(+1);
    const playerUnits = countUnits(-1);
    const enemyTowerRatio = STATE.enemy.towerHP / STATE.enemy.towerMax;

    // Lógica de decisión: descansar para acumular, atacar con masa, defender si está débil
    if(enemyTowerRatio < 0.4){
      // Crítico: defender
      STATE.enemy.mode = 'defend';
      STATE.enemyDecideTimer = 10 + Math.random()*5;
    } else if(enemyUnits >= 5){
      // Suficientes tropas: ¡atacar en masa!
      STATE.enemy.mode = 'attack';
      STATE.enemyDecideTimer = 8 + Math.random()*5;
      STATE.enemySpawnInterval = 2.5; // sigue produciendo durante ataque
    } else if(STATE.enemy.mode === 'rest' && enemyUnits >= 3 && Math.random() < 0.6){
      // Si tiene algo acumulado y dado azar -> atacar
      STATE.enemy.mode = 'attack';
      STATE.enemyDecideTimer = 8 + Math.random()*4;
    } else {
      // Acumular más tropas
      STATE.enemy.mode = 'rest';
      STATE.enemyDecideTimer = 15 + Math.random()*8;
      STATE.enemySpawnInterval = 3.5;
    }

    // Reacción al jugador: si jugador ataca con muchos -> defender
    if(playerUnits >= 4 && STATE.player.mode === 'attack'){
      if(Math.random() < 0.5){
        STATE.enemy.mode = 'defend';
        STATE.enemyDecideTimer = 8;
      }
    }

    document.getElementById('ai-mode').textContent =
      STATE.enemy.mode==='rest'?'acumulando':STATE.enemy.mode==='attack'?'atacando':'defendiendo';
  }

  // ── Comprar torreta ──
  if(STATE.enemyTurretTimer <= 0){
    STATE.enemyTurretTimer = 8 + Math.random()*5;
    // Mas probabilidad si esta en defensa o si jugador ataca
    let prob = 0.7;
    if(STATE.enemy.mode === 'defend') prob = 0.9;
    if(countTurrets(+1) < 3) prob = Math.min(1, prob + 0.15); // primeras torretas casi seguras
    if(STATE.enemy.mineral >= TURRET_DEF.cost && Math.random() < prob){
      const sl = findFreeTurretSlot(+1);
      if(sl){
        STATE.enemy.mineral -= TURRET_DEF.cost;
        const t = spawnTurret(+1, sl.x);
        t.mesh.position.z = sl.z;
      }
    }
  }

  // ── Comprar camión adicional ──
  if(STATE.enemyTruckTimer <= 0){
    STATE.enemyTruckTimer = 18 + Math.random()*10;
    if(STATE.enemy.mineral >= TRUCK_DEF.cost && countTrucks(+1) < TRUCK_DEF.maxPerSide && Math.random() < 0.75){
      STATE.enemy.mineral -= TRUCK_DEF.cost;
      STATE.trucks.push(spawnTruckFor(+1, 4));
    }
  }

  // ── Spawn de unidades (intervalo según modo) ──
  if(STATE.enemySpawnTimer <= 0){
    STATE.enemySpawnTimer = STATE.enemySpawnInterval + Math.random()*1.5;

    // Si tiene MUCHO mineral acumulado (15+), priorizar comprar dinosaurio
    let type = null;
    if(STATE.enemy.mineral >= 15 && Math.random() < 0.6){
      type = 'dino';
    } else {
      const avail = Object.entries(UNIT_DEFS).filter(([k,d])=>STATE.enemy.mineral>=d.cost);
      if(!avail.length) return;
      let pool = avail;
      if(STATE.enemy.mode === 'defend'){
        const filtered = avail.filter(([k])=>['ranged','tank','drone'].includes(k));
        if(filtered.length) pool = filtered;
      } else if(STATE.enemy.mode === 'attack'){
        const filtered = avail.filter(([k])=>['barbarian','dino','melee','tank'].includes(k));
        if(filtered.length && Math.random()<0.85) pool = filtered;
      } else {
        // En descanso/acumulando: diversidad
        if(STATE.enemy.mineral >= 9 && Math.random() < 0.35){
          // Tendencia a unidades caras al acumular
          const expensive = avail.filter(([k])=>['dino','tank','barbarian'].includes(k));
          if(expensive.length) pool = expensive;
        }
      }
      [type] = pool[Math.floor(Math.random()*pool.length)];
    }

    if(STATE.enemy.mineral < UNIT_DEFS[type].cost) return;
    STATE.enemy.mineral -= UNIT_DEFS[type].cost;
    let esx, esz;
    if(type==='dino'){
      esx = LANE_LEN/2 + 4 - Math.random()*2;
      esz = (Math.random()-0.5) * 12;
    } else if(type==='ranged' || type==='drone'){
      esx = LANE_LEN/2 + 3 - Math.random()*3;
      esz = (Math.random()-0.5) * 10;
    } else {
      esx = LANE_LEN/2 - 1 - Math.random()*3;
      esz = (Math.random()-0.5) * 8;
    }
    spawnUnitGroupZ(type, +1, esx, esz);
  }
}

// ═══ MODOS DEL JUGADOR ═══
window.setMode = function(mode){
  STATE.player.mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+mode).classList.add('active');
  playSound(520,'sine',0.08,0.03);
};

// ═══ AUTO-SPAWN CONTINUO ═══
// Click en carta = se queda activa produciendo automáticamente
// Click en otra = cambia
// Click en misma = se desactiva
document.querySelectorAll('.ucard').forEach(card=>{
  card.addEventListener('click',()=>{
    initAudio();
    const u = card.dataset.unit;

    // Si ya está activa esta misma, desactivar
    if(STATE.autoSpawnUnit === u){
      STATE.autoSpawnUnit = null;
      card.classList.remove('active');
      return;
    }

    // Cambiar a esta unidad
    document.querySelectorAll('.ucard').forEach(c=>c.classList.remove('active'));
    STATE.autoSpawnUnit = u;
    STATE.autoSpawnTimer = 0; // spawn inmediato al activar
    card.classList.add('active');
  });
});

function doAutoSpawn(){
  const u = STATE.autoSpawnUnit;
  if(!u) return;
  if(u==='turret'){
    if(STATE.player.mineral<TURRET_DEF.cost) return;
    const sl=findFreeTurretSlot(-1); if(!sl){
      // se acabaron slots, desactivar
      STATE.autoSpawnUnit=null;
      document.querySelectorAll('.ucard').forEach(c=>c.classList.remove('active'));
      return;
    }
    STATE.player.mineral-=TURRET_DEF.cost;
    const t=spawnTurret(-1,sl.x); t.mesh.position.z=sl.z;
    playSound(720,'sine',0.08,0.03);
  } else if(u==='truck'){
    if(STATE.player.mineral<TRUCK_DEF.cost||countTrucks(-1)>=TRUCK_DEF.maxPerSide){
      // no se puede mas, desactivar
      STATE.autoSpawnUnit=null;
      document.querySelectorAll('.ucard').forEach(c=>c.classList.remove('active'));
      return;
    }
    STATE.player.mineral-=TRUCK_DEF.cost;
    STATE.trucks.push(spawnTruckFor(-1,countTrucks(-1)===1?6:4));
    playSound(720,'sine',0.08,0.03);
  } else {
    const def=UNIT_DEFS[u];
    if(!def||STATE.player.mineral<def.cost) return;
    STATE.player.mineral-=def.cost;
    // Spawn diferenciado por tipo de unidad
    let sx, sz;
    if(u==='dino'){
      // Dino aparece muy atras, fondo del campito
      sx = -LANE_LEN/2 - 4 + Math.random()*2;
      sz = (Math.random()-0.5) * 12;
    } else if(u==='ranged' || u==='drone'){
      // Rangos y drones tambien al fondo (no invasivo)
      sx = -LANE_LEN/2 - 3 + Math.random()*3;
      sz = (Math.random()-0.5) * 10;
    } else {
      // Melee, tanque, barbaro: cerca de la base
      sx = -LANE_LEN/2 + 1 + Math.random()*3;
      sz = (Math.random()-0.5) * 8;
    }
    spawnUnitGroupZ(u, -1, sx, sz);
  }
  updateHUD();
}

// ═══ HUD ═══
function updateHUD(){
  document.getElementById('mcount').textContent=Math.floor(STATE.player.mineral);
  document.getElementById('hp-player').style.width=(Math.max(0,STATE.player.towerHP)/STATE.player.towerMax*100)+'%';
  document.getElementById('hp-enemy').style.width=(Math.max(0,STATE.enemy.towerHP)/STATE.enemy.towerMax*100)+'%';
  const free=getTurretSlots(-1).length-countTurrets(-1);
  document.getElementById('turret-count').textContent=free+' slots';
  document.getElementById('truck-count').textContent=countTrucks(-1)+'/'+TRUCK_DEF.maxPerSide;
  document.querySelectorAll('.ucard').forEach(card=>{
    const uk=card.dataset.unit;
    let dis=false;
    if(uk==='turret') dis=STATE.player.mineral<TURRET_DEF.cost||!findFreeTurretSlot(-1);
    else if(uk==='truck') dis=STATE.player.mineral<TRUCK_DEF.cost||countTrucks(-1)>=TRUCK_DEF.maxPerSide;
    else dis=STATE.player.mineral<(UNIT_DEFS[uk]?.cost||999);
    if(dis) card.classList.add('disabled');
    else card.classList.remove('disabled');
  });
}

// ═══ MAIN LOOP ═══
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if(STATE.gameOver){
    try { renderer.render(scene,camera); } catch(e){}
    return;
  }
  try {
    animateFrame();
  } catch(err){
    console.error('Error en frame, continuando:', err);
    // No matar el loop por un error puntual
  }
}

function animateFrame(){
  const dt=Math.min(0.05,clock.getDelta());
  const elapsed=clock.getElapsedTime();

  // Auto-spawn continuo del jugador
  if(STATE.autoSpawnUnit){
    STATE.autoSpawnTimer -= dt;
    if(STATE.autoSpawnTimer <= 0){
      STATE.autoSpawnTimer = 1.4; // intervalo entre spawns
      doAutoSpawn();
    }
  }

  // Decrementar timers de aggro
  if(STATE.player.droneAggroTimer > 0) STATE.player.droneAggroTimer -= dt;
  if(STATE.enemy.droneAggroTimer > 0) STATE.enemy.droneAggroTimer -= dt;

  // Auto-transicion defensa -> descanso si no hay enemigos cerca
  function checkDefendCalm(side){
    const pl = side===-1 ? STATE.player : STATE.enemy;
    if(pl.mode !== 'defend') { pl.defendCalmTimer = 0; return; }
    // Verificar si hay enemigos en mi lado
    const myHalf = side===-1;
    let hasEnemyNear = false;
    for(const u of STATE.units){
      if(u.side === side) continue;
      const inMyZone = myHalf ? u.mesh.position.x < 4 : u.mesh.position.x > -4;
      if(inMyZone){ hasEnemyNear = true; break; }
    }
    if(hasEnemyNear){
      pl.defendCalmTimer = 0;
    } else {
      pl.defendCalmTimer += dt;
      if(pl.defendCalmTimer > 5){
        pl.mode = 'rest';
        pl.defendCalmTimer = 0;
        if(side===-1){
          // Actualizar UI del jugador
          document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
          document.getElementById('btn-rest').classList.add('active');
        } else {
          document.getElementById('ai-mode').textContent = 'acumulando';
        }
      }
    }
  }
  checkDefendCalm(-1);
  checkDefendCalm(+1);

  STATE.trucks.forEach(t=>updateTruck(t,dt));
  STATE.units.forEach(u=>updateUnit(u,dt));
  STATE.turrets.forEach(t=>updateTurret(t,dt));
  updateBaseTower(-1,dt); updateBaseTower(+1,dt);
  updateProjectiles(dt);
  cleanDeadUnits(); cleanDeadTurrets();
  updateEnemyAI(dt);
  updateFog(dt, elapsed);

  // Minerales
  for(const m of [...pMins,...eMins]){
    m.rotation.y+=m.userData.spinSpeed;
    m.position.y=0.5+Math.sin(elapsed*2+m.position.x)*0.07;
  }

  // Nubes deslizandose
  for(const c of clouds){
    c.position.x += c.userData.speed * dt;
    if(c.position.x > 80) c.position.x = -80;
  }

  // Banderas
  playerTower.children.forEach(c=>{if(c.geometry?.parameters?.width===1.0) c.rotation.y=Math.sin(elapsed*2)*0.2;});
  enemyTower.children.forEach(c=>{if(c.geometry?.parameters?.width===1.0) c.rotation.y=Math.sin(elapsed*2+1)*0.2;});

  updateHUD();

  if(STATE.player.towerHP<=0){STATE.gameOver=true;showMsg('¡Derrota!','#ef5350');}
  else if(STATE.enemy.towerHP<=0){STATE.gameOver=true;showMsg('¡Victoria!','#4fc3f7');}

  renderer.render(scene,camera);
}

function showMsg(t,c){
  const m=document.getElementById('msg');
  m.textContent=t; m.style.color=c; m.classList.add('show');
  document.getElementById('rbtn').style.display='block';
  playSound(t==='¡Victoria!'?660:220, 'sine', 1.2, 0.08);
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

document.addEventListener('click', initAudio, {once:true});

updateHUD();
animate();
</script>
